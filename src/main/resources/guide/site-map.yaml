# 站内引导 · 卡片文案
#
# 这个文件只提供"文案"，不提供"结构"。
# 有哪些页面、路由是什么、需要什么权限，全部来自 Controller 上的 @GuideCard 注解 ——
# 这里写了一个代码里不存在的 key，服务会拒绝启动（SiteMapValidator C4）。
#
# 字段说明：
#   summary   一句话说明，会显示在卡片正面，控制在 40 字内
#   steps     操作步骤，卡片展开后显示，建议 3 条以内
#   tips      容易踩的坑
#   highlight 跳转后要高亮的元素选择器（配合页面上的 id / data-guide-target）

cards:
  dashboard:
    summary: "一眼看到你的待办：待审核、被驳回、草稿数量"
    steps:
      - "看「我的稿件」四个数字，判断下一步该做什么"
      - "有被驳回的文章就先改，改完重新提交"
      - "审核员和管理员还能看到全站待审核数量"
    tips:
      - "数字是实时查数据库算出来的，不是缓存"

  article.create:
    summary: "起草新文章，写完后提交审核"
    steps:
      - "填标题和摘要，摘要会出现在列表和前台列表里"
      - "选择分类，分类必须处于启用状态"
      - "保存后回到列表，点「提交审核」进入待审核"
    tips:
      - "被驳回的文章修改后会回到草稿状态，需要重新提交"
    highlight: "#article-title"

  article.list:
    summary: "按状态、分类、关键词筛选稿件，支持批量发布和下架"
    steps:
      - "用状态和分类缩小范围，关键词同时匹配标题和摘要"
      - "勾选多篇可以批量通过或批量下架"
      - "点标题进入编辑；草稿和已驳回的才能改"
    tips:
      - "已发布的文章不能直接编辑或删除，先下架再撤回"
    highlight: "#article-keyword"

  article.review:
    summary: "审核待发布的稿件，通过或驳回都要留意见"
    steps:
      - "这里只显示待审核的文章"
      - "通过直接点「通过」，文章立即出现在前台"
      - "驳回必须写意见，作者会看到"
    tips:
      - "不能审核自己提交的文章，这是硬性规则"

  category.manage:
    summary: "维护多级分类：新增、排序、启用停用"
    steps:
      - "选上级分类后新增，最多三级"
      - "改排序值可以调整同级顺序"
      - "停用后该分类不能再用于新文章"
    tips:
      - "有子分类、或下面还挂着文章的分类不能删除"

  user.manage:
    summary: "新增账号、分配角色、启用或停用"
    steps:
      - "新增用户时设置初始密码和角色"
      - "用户名创建后不可修改，用于审计追踪"
      - "停用账号会让它立刻下线"
    tips:
      - "系统至少保留一名可用管理员，最后一个管理员停不掉也删不掉"

  role.manage:
    summary: "给角色勾选权限点，改动对下一个请求立即生效"
    steps:
      - "选一个角色，勾选它应该拥有的权限"
      - "保存后，该角色下的用户无需重新登录即可生效"
      - "新增角色要先填编码，编码创建后不可修改"
    tips:
      - "管理员角色是系统内置的，不允许删除"

  log.list:
    summary: "按人、按类型、按时间查操作记录，越权尝试也在里面"
    steps:
      - "按操作类型筛，比如只看审核或只看登录"
      - "按结果筛 DENIED 能看到所有被权限拦下的尝试"
      - "点开某条能看到参数（敏感字段已脱敏）"
    tips:
      - "密码、令牌之类的字段在日志里显示为 ***"

  portal.list:
    summary: "游客看到的前台首页，只显示已发布的文章"
    steps:
      - "没有登录也能访问，按分类浏览"
      - "点标题进入正文，阅读量会累加"
      - "草稿和待审核的文章在这里看不到"
